name: open_pixel_poi
description: "Companion app for Open Pixel Poi, for controlling the LED poi and creating and uploading patterns over Bluetooth."
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  async: ^2.13.0
  provider: ^6.1.5
  flutter_blue_plus: ^2.3.12
  rxdart: ^0.28.0
  image: ^4.8.0
  path: ^1.9.1
  sqflite: ^2.4.3
  sqflite_common_ffi: ^2.4.2
  sqflite_common_ffi_web: ^1.1.2
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - patterns/
    - fonts/
