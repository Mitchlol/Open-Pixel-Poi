name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    name: Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Software/open_pixel_poi
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test

  firmware:
    name: Firmware
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Firmware/open_pixel_poi_firmware_platformio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: platformio-${{ hashFiles('Firmware/open_pixel_poi_firmware_platformio/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build firmware
        run: pio run
