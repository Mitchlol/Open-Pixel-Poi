; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Use espressif32 @ 6.4.0 because arduino-core versions newer than 2.0.12 cause glitchy leds 
; https://gist.github.com/sivar2311/5125011eaaf859eff90c4b502e1408b1
[platformio]
default_envs = blank_canvas

[env]
platform = espressif32 @ 6.4.0
board = seeed_xiao_esp32c3
framework = arduino
board_build.partitions = opp_partitions.csv
board_build.filesystem = littlefs
lib_deps = 
	makuna/NeoPixelBus@^2.8.4

; One environment per hardware kit, OPP_KIT picks the defaults in src/config.h
[env:blank_canvas]

[env:kit_2_2_1_20px]
build_flags = -D OPP_KIT=KIT_2_2_1_20PX

[env:kit_3_0_0_25px]
build_flags = -D OPP_KIT=KIT_3_0_0_25PX

[env:kit_3_0_0_55px]
build_flags = -D OPP_KIT=KIT_3_0_0_55PX
